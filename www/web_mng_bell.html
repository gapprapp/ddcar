  <style>
    body{color: #666;}
    a{ color: #999;}
    a:hover{color: #666;}
    .active{color: #666;}
    .cus-odd, .cus-even{
      padding-top: 1%; padding-bottom: 1%; color: #fff; margin-bottom: 1%; cursor: pointer;
    }
    .cus-odd{
      background-color: #999;
    }
    .cus-even{
      background-color: #858585;
    }
    h5{
      letter-spacing: 2px;
    }
    ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }   
    .yellow{
        color: #ffbb33;
    }
    .red{
      color: #d63232;
    }
    .green{
      color: #3dd12a;
    } 
  </style>
  <script>
    var start = 0;
    var bool = false;
    var color;   
    $(document).ready(function(){
      if(!localStorage.user_id){
				window.location = 'web_login.html';
      }
      get_bell();

      window.addEventListener('scroll', () => { 
        // Calculate the scroll position 
        const scrollPosition = window.scrollY + window.innerHeight; 
        const documentHeight = document.documentElement.scrollHeight; 
    
        // Check if the user has scrolled to the bottom 
        if (scrollPosition >= documentHeight) { 
          if(!$("#myUL").prop('hidden')){              
              if(bool){
                return 0;
              }
              get_bell();           
            }
        } 
      });
    });

    $(document).keydown(function(objEvent) {
      if (objEvent.keyCode == 13) {  //enter pressed
        objEvent.preventDefault();           
        search();        
      }         
    })

    function get_bell(){
      $.ajax({
        type: "POST",
        url:"php/get_status_prod.php",
        data: {'start' : start},
        beforeSend: function(){
          EasyLoading.show({
						text: "กำลังโหลด"
					});
        },
        success: function(data){
          EasyLoading.hide();
          var obj = jQuery.parseJSON(data);
          if(obj){
            $.each(obj, function(i, field){
              var prod_id = field.prod_id;
              var prod_name = field.prod_name;
              var status = field.status;            
              switch(status) {
                case "normal":
                  color = "green";
                  break;
                case "warning":
                  color = "yellow";
                  break;
                case "danger":
                  color = "red";
                  break;
              }
              if(i % 2 == 0){
                $('#myUL').append('<li> <div class="row justify-content-center cus-odd">'+
                  '<div class="col-1"><i class="fas fa-circle '+color+'"></i></div>'+
                  '<div class="col-8 text-center"><h5>'+prod_name+'</h5></div>'+
                '</div></li>');
              }else{
                $('#myUL').append('<li> <div class="row justify-content-center cus-even">'+
                  '<div class="col-1"><i class="fas fa-circle '+color+'"></i></div>'+
                  '<div class="col-8 text-center"><h5>'+prod_name+'</h5></div>'+
                '</div></li>');
              }
            });
          }
        }
      });
      start += 20;
    }

    function logout(){
			localStorage.clear();
		}    
  </script>
