  <style>
    body{color: var(--text-primary);}
    .cus-odd, .cus-even{
      padding-top: 14px; padding-bottom: 14px; color: var(--text-primary); margin-bottom: 8px; cursor: pointer;
      background-color: #ffffff !important; border: 1px solid var(--border-light); border-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm); transition: all 0.15s ease;
    }
    .cus-odd:hover, .cus-even:hover{
      border-color: var(--color-dark) !important; background-color: #f8fafc !important; box-shadow: var(--shadow-md); transform: translateY(-1px);
    }
    .cus-odd h5, .cus-even h5{
      color: var(--color-black) !important; font-weight: 600; font-size: 1rem;
    }
    h5{
      letter-spacing: 2px;
    }
    ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }   
    .yellow{
        color: #ffbb33;
    }
    .red{
      color: #d63232;
    }
    .green{
      color: #3dd12a;
    } 
  </style>
  <script>
    var start = 0;
    var bool = false;
    var color;   
    $(document).ready(function(){
      if(!localStorage.user_id){
				window.location = 'web_login.html';
      }
      get_bell();

      window.addEventListener('scroll', () => { 
        // Calculate the scroll position 
        const scrollPosition = window.scrollY + window.innerHeight; 
        const documentHeight = document.documentElement.scrollHeight; 
    
        // Check if the user has scrolled to the bottom 
        if (scrollPosition >= documentHeight) { 
          if(!$("#myUL").prop('hidden')){              
              if(bool){
                return 0;
              }
              get_bell();           
            }
        } 
      });
    });

    $(document).keydown(function(objEvent) {
      if (objEvent.keyCode == 13) {  //enter pressed
        objEvent.preventDefault();           
        search();        
      }         
    })

    function get_bell(){
      $.ajax({
        type: "POST",
        url:"php/get_status_prod.php",
        data: {'start' : start},
        beforeSend: function(){
          EasyLoading.show({
						text: "กำลังโหลด"
					});
        },
        success: function(data){
          EasyLoading.hide();
          var obj = jQuery.parseJSON(data);
          if(obj){
            $.each(obj, function(i, field){
              var prod_id = field.prod_id;
              var prod_name = field.prod_name;
              var status = field.status;            
              switch(status) {
                case "normal":
                  color = "green";
                  break;
                case "warning":
                  color = "yellow";
                  break;
                case "danger":
                  color = "red";
                  break;
              }
              if(i % 2 == 0){
                $('#myUL').append('<li> <div class="row justify-content-center cus-odd">'+
                  '<div class="col-1"><i class="fas fa-circle '+color+'"></i></div>'+
                  '<div class="col-8 text-center"><h5>'+prod_name+'</h5></div>'+
                '</div></li>');
              }else{
                $('#myUL').append('<li> <div class="row justify-content-center cus-even">'+
                  '<div class="col-1"><i class="fas fa-circle '+color+'"></i></div>'+
                  '<div class="col-8 text-center"><h5>'+prod_name+'</h5></div>'+
                '</div></li>');
              }
            });
          }
        }
      });
      start += 20;
    }

    function logout(){
			localStorage.clear();
		}    
  </script>
